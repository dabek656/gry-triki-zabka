<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
>

<title>TRIKI Pong</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #080808;
    color: white;

    font-family: Arial, sans-serif;

    touch-action: none;

    user-select: none;
    -webkit-user-select: none;
}


/* =========================
   MENU
========================= */

#menu {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    padding:
        env(safe-area-inset-top)
        25px
        env(safe-area-inset-bottom)
        25px;

    background: #080808;

    z-index: 10;

    text-align: center;
}


#menu h1 {

    margin: 0 0 10px;

    font-size: clamp(
        50px,
        15vw,
        80px
    );

}


#status {

    margin-bottom: 25px;

    color: #aaa;

    font-size: 17px;

}


#connect {

    border: none;

    border-radius: 15px;

    padding: 17px 28px;

    font-size: 19px;

    font-weight: bold;

    color: white;

    background: #00c853;

    cursor: pointer;

    min-height: 58px;

}


#connect:active {

    transform: scale(0.96);

}


/* =========================
   GRA
========================= */

#game {

    display: none;

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

}


canvas {

    position: absolute;

    inset: 0;

    display: block;

    width: 100%;
    height: 100%;

}


/* =========================
   INFO
========================= */

#info {

    position: fixed;

    top:
        calc(
            env(safe-area-inset-top)
            + 10px
        );

    left: 0;
    right: 0;

    text-align: center;

    pointer-events: none;

    font-size: 14px;

    color: #888;

}


/* =========================
   WYNIK
========================= */

#score {

    position: fixed;

    top:
        calc(
            env(safe-area-inset-top)
            + 32px
        );

    left: 0;
    right: 0;

    display: flex;

    justify-content: center;

    gap: 55px;

    pointer-events: none;

    font-size: clamp(
        45px,
        13vw,
        75px
    );

    font-weight: bold;

}


#playerScore {

    color: #00e676;

}


#enemyScore {

    color: #ff5252;

}


/* =========================
   PORADA NA PION
========================= */

#rotate {

    display: none;

    position: fixed;

    inset: 0;

    background: #080808;

    z-index: 20;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 30px;

}


#rotateText {

    font-size: 24px;

    line-height: 1.5;

}


</style>

</head>

<body>


<!-- =========================
     MENU
========================= -->

<div id="menu">

    <h1>🏓</h1>

    <h1>PONG</h1>

    <div id="status">
        Podłącz Triki
    </div>

    <button id="connect">
        🔵 POŁĄCZ TRIKI
    </button>

</div>


<!-- =========================
     GRA
========================= -->

<div id="game">

    <canvas id="canvas"></canvas>

    <div id="info">
        🔄 Obracaj Triki
    </div>

    <div id="score">

        <span id="playerScore">
            0
        </span>

        <span id="enemyScore">
            0
        </span>

    </div>

</div>


<!-- =========================
     OBRÓĆ TELEFON
========================= -->

<div id="rotate">

    <div id="rotateText">

        📱↔️

        <br><br>

        Obróć telefon poziomo,
        żeby grać.

    </div>

</div>


<script type="module">


/* =====================================
   TRIKI
===================================== */

import {
    TrikiController
} from
"https://esm.sh/triki-controller";


const triki =
    new TrikiController({

        fusion: true,

        rateHz: 104

    });


let trikiConnected =
    false;


/* =====================================
   ELEMENTY
===================================== */

const menu =
    document.getElementById(
        "menu"
    );


const game =
    document.getElementById(
        "game"
    );


const status =
    document.getElementById(
        "status"
    );


const rotate =
    document.getElementById(
        "rotate"
    );


const canvas =
    document.getElementById(
        "canvas"
    );


const ctx =
    canvas.getContext("2d");


const playerScoreElement =
    document.getElementById(
        "playerScore"
    );


const enemyScoreElement =
    document.getElementById(
        "enemyScore"
    );


/* =====================================
   CANVAS
===================================== */

function resize() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        window.innerWidth * dpr;


    canvas.height =
        window.innerHeight * dpr;


    canvas.style.width =
        window.innerWidth + "px";


    canvas.style.height =
        window.innerHeight + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    /*
        Po zmianie orientacji
        ustawiamy gracza na środku.
    */

    if (player) {

        player.y =
            window.innerHeight / 2
            - player.height / 2;

    }

}


window.addEventListener(
    "resize",
    resize
);


/* =====================================
   ORIENTACJA TELEFONU
===================================== */

function checkOrientation() {

    /*
        Gra najlepiej działa poziomo.
    */

    if (
        window.innerHeight >
        window.innerWidth
    ) {

        rotate.style.display =
            "flex";

    } else {

        rotate.style.display =
            "none";

    }

}


window.addEventListener(
    "resize",
    checkOrientation
);


window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            () => {

                resize();
                checkOrientation();

            },
            300
        );

    }
);


/* =====================================
   GRACZ
===================================== */

const player = {

    x: 25,

    y: 0,

    width: 18,

    height: 110

};


/* =====================================
   PRZECIWNIK
===================================== */

const enemy = {

    x: 0,

    y: 0,

    width: 18,

    height: 110,

    speed: 4

};


/* =====================================
   PIŁKA
===================================== */

const ball = {

    x: 0,

    y: 0,

    radius: 9,

    speedX: 4,

    speedY: 2.5

};


/* =====================================
   WYNIK
===================================== */

let playerScore = 0;

let enemyScore = 0;


/* =====================================
   USTAWIENIA TRIKI
===================================== */


/*
    Im mniejsza liczba,
    tym wolniejsza paletka.
*/

const SENSITIVITY =
    0.35;


/*
    Ignorowanie małych
    drgań żyroskopu.
*/

const DEADZONE =
    1.0;


/*
    Wygładzanie ruchu.
*/

const SMOOTHING =
    0.12;


/* =====================================
   POZYCJA TRIKI
===================================== */

let targetY = 0;

let smoothY = 0;


/* =====================================
   TRIKI — ŻYROSKOP
===================================== */

triki.on(
    "frame",
    frame => {

        if (!trikiConnected)
            return;


        const gyro =
            frame.gyro;


        let velocity =
            gyro.z;


        /*
            DEADZONE
        */

        if (
            Math.abs(velocity)
            < DEADZONE
        ) {

            velocity = 0;

        }


        /*
            Obrót Triki
            przesuwa paletkę.
        */

        targetY +=
            velocity *
            SENSITIVITY;


        /*
            Granice.
        */

        const maxY =
            window.innerHeight -
            player.height;


        targetY =
            Math.max(
                0,
                Math.min(
                    maxY,
                    targetY
                )
            );

    }
);


/* =====================================
   RESET POZYCJI
===================================== */

function resetPositions() {

    player.x =
        25;


    player.y =
        window.innerHeight / 2
        - player.height / 2;


    enemy.x =
        window.innerWidth -
        43;


    enemy.y =
        window.innerHeight / 2
        - enemy.height / 2;


    targetY =
        player.y;


    smoothY =
        player.y;

}


/* =====================================
   POŁĄCZENIE
===================================== */

document
.getElementById("connect")
.addEventListener(
    "click",
    async () => {

        try {

            status.textContent =
                "🔵 Łączenie...";


            await triki.connect();


            trikiConnected =
                true;


            menu.style.display =
                "none";


            game.style.display =
                "block";


            resize();

            checkOrientation();

            resetPositions();

            resetBall();


            requestAnimationFrame(
                gameLoop
            );

        }

        catch (error) {

            console.error(error);


            status.textContent =
                "❌ " +
                error.message;

        }

    }
);


/* =====================================
   RESET PIŁKI
===================================== */

function resetBall() {

    ball.x =
        window.innerWidth / 2;


    ball.y =
        window.innerHeight / 2;


    ball.speedX =
        Math.random() > 0.5
            ? 4
            : -4;


    ball.speedY =
        (Math.random() - 0.5) * 5;

}


/* =====================================
   KOLIZJA
===================================== */

function paddleCollision(
    paddle
) {

    return (

        ball.x -
        ball.radius <
        paddle.x +
        paddle.width

        &&

        ball.x +
        ball.radius >
        paddle.x

        &&

        ball.y +
        ball.radius >
        paddle.y

        &&

        ball.y -
        ball.radius <
        paddle.y +
        paddle.height

    );

}


/* =====================================
   AI
===================================== */

function updateEnemy() {

    const target =
        ball.y -
        enemy.height / 2;


    if (
        enemy.y <
        target
    ) {

        enemy.y +=
            enemy.speed;

    }


    if (
        enemy.y >
        target
    ) {

        enemy.y -=
            enemy.speed;

    }


    if (
        enemy.y < 0
    ) {

        enemy.y = 0;

    }


    const maxY =
        window.innerHeight -
        enemy.height;


    if (
        enemy.y > maxY
    ) {

        enemy.y =
            maxY;

    }

}


/* =====================================
   UPDATE
===================================== */

function update() {

    /*
        Wygładzanie paletki.
    */

    smoothY +=
        (
            targetY -
            smoothY
        ) *
        SMOOTHING;


    player.y =
        smoothY;


    updateEnemy();


    /*
        Piłka.
    */

    ball.x +=
        ball.speedX;


    ball.y +=
        ball.speedY;


    /*
        Góra / dół.
    */

    if (

        ball.y -
        ball.radius <= 0

        ||

        ball.y +
        ball.radius >=
        window.innerHeight

    ) {

        ball.speedY *=
            -1;

    }


    /*
        Gracz.
    */

    if (

        paddleCollision(
            player
        )

        &&

        ball.speedX < 0

    ) {

        ball.speedX *=
            -1;


        const hit =

            (
                ball.y -
                (
                    player.y +
                    player.height / 2
                )
            )
            /
            (
                player.height / 2
            );


        ball.speedY =
            hit * 5;

    }


    /*
        Przeciwnik.
    */

    if (

        paddleCollision(
            enemy
        )

        &&

        ball.speedX > 0

    ) {

        ball.speedX *=
            -1;


        const hit =

            (
                ball.y -
                (
                    enemy.y +
                    enemy.height / 2
                )
            )
            /
            (
                enemy.height / 2
            );


        ball.speedY =
            hit * 5;

    }


    /*
        Punkt przeciwnika.
    */

    if (
        ball.x < 0
    ) {

        enemyScore++;

        enemyScoreElement.textContent =
            enemyScore;

        resetBall();

    }


    /*
        Punkt gracza.
    */

    if (
        ball.x >
        window.innerWidth
    ) {

        playerScore++;

        playerScoreElement.textContent =
            playerScore;

        resetBall();

    }

}


/* =====================================
   RYSOWANIE
===================================== */

function draw() {

    const width =
        window.innerWidth;


    const height =
        window.innerHeight;


    /*
        Tło.
    */

    ctx.fillStyle =
        "#080808";


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
        Linia środka.
    */

    ctx.strokeStyle =
        "#333";


    ctx.lineWidth =
        3;


    ctx.setLineDash([
        10,
        15
    ]);


    ctx.beginPath();


    ctx.moveTo(
        width / 2,
        0
    );


    ctx.lineTo(
        width / 2,
        height
    );


    ctx.stroke();


    ctx.setLineDash([]);


    /*
        Paletka gracza.
    */

    ctx.fillStyle =
        "#00e676";


    ctx.fillRect(

        player.x,
        player.y,

        player.width,
        player.height

    );


    /*
        Paletka przeciwnika.
    */

    ctx.fillStyle =
        "#ff5252";


    ctx.fillRect(

        enemy.x,
        enemy.y,

        enemy.width,
        enemy.height

    );


    /*
        Piłka.
    */

    ctx.fillStyle =
        "#ffffff";


    ctx.beginPath();


    ctx.arc(

        ball.x,
        ball.y,

        ball.radius,

        0,
        Math.PI * 2

    );


    ctx.fill();

}


/* =====================================
   GAME LOOP
===================================== */

function gameLoop() {

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================
   START
===================================== */

resize();

checkOrientation();

resetPositions();

</script>

</body>
</html>
