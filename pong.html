<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TRIKI Pong</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#menu {
    position: fixed;
    inset: 0;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background: #080808;

    z-index: 10;
}

h1 {
    font-size: 70px;
    margin: 0 0 10px;
}

#status {
    margin-bottom: 25px;
    color: #aaa;
}

button {
    border: none;
    border-radius: 12px;

    padding: 15px 30px;

    font-size: 20px;
    font-weight: bold;

    cursor: pointer;

    background: #00c853;
    color: white;
}

button:hover {
    background: #00e676;
}

#game {
    display: none;

    width: 100vw;
    height: 100vh;
}

canvas {
    display: block;

    width: 100%;
    height: 100%;
}

#info {
    position: fixed;

    top: 15px;
    left: 0;
    right: 0;

    text-align: center;

    pointer-events: none;

    font-size: 18px;

    color: #aaa;
}

</style>
</head>

<body>


<!-- MENU -->

<div id="menu">

    <h1>🏓 PONG</h1>

    <div id="status">
        Podłącz Triki
    </div>

    <button id="connect">
        🔵 POŁĄCZ TRIKI
    </button>

</div>


<!-- GRA -->

<div id="game">

    <canvas id="canvas"></canvas>

    <div id="info">
        🔄 Obracaj Triki → steruj paletką
    </div>

</div>


<script type="module">


/* =====================================
   TRIKI
===================================== */

import {
    TrikiController
} from "https://esm.sh/triki-controller";


const triki =
    new TrikiController({

        fusion: true,

        rateHz: 104

    });


let trikiConnected = false;


/* =====================================
   CANVAS
===================================== */

const canvas =
    document.getElementById("canvas");


const ctx =
    canvas.getContext("2d");


function resize() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}


window.addEventListener(
    "resize",
    resize
);

resize();


/* =====================================
   GRACZ
===================================== */

const player = {

    x: 40,

    y: canvas.height / 2 - 60,

    width: 18,

    height: 120

};


/* =====================================
   PRZECIWNIK
===================================== */

const enemy = {

    x: canvas.width - 58,

    y: canvas.height / 2 - 60,

    width: 18,

    height: 120,

    speed: 4

};


/* =====================================
   PIŁKA
===================================== */

const ball = {

    x: canvas.width / 2,

    y: canvas.height / 2,

    radius: 10,

    speedX: 4,

    speedY: 2.5

};


/* =====================================
   WYNIK
===================================== */

let playerScore = 0;

let enemyScore = 0;


/* =====================================
   USTAWIENIA TRIKI
===================================== */


/*
    IM MNIEJ, TYM WOLNIEJ
*/

const SENSITIVITY = 0.35;


/*
    Ignorowanie bardzo małych
    drgań żyroskopu.
*/

const DEADZONE = 1.0;


/*
    Płynność ruchu.
*/

const SMOOTHING = 0.12;


/*
    Pozycja docelowa paletki.
*/

let targetY =
    canvas.height / 2 -
    player.height / 2;


/*
    Wygładzona pozycja.
*/

let smoothY =
    targetY;


/* =====================================
   ODCZYT TRIKI
===================================== */

triki.on(
    "frame",
    frame => {

        if (!trikiConnected)
            return;


        const gyro =
            frame.gyro;


        let velocity =
            gyro.z;


        /*
            DEADZONE
        */

        if (
            Math.abs(velocity)
            < DEADZONE
        ) {

            velocity = 0;

        }


        /*
            Sterowanie.

            Obrót w jedną stronę
            przesuwa paletkę w górę.

            Obrót w drugą
            przesuwa w dół.
        */

        targetY +=
            velocity *
            SENSITIVITY;


        /*
            Ograniczenie
            do ekranu.
        */

        const maxY =
            canvas.height -
            player.height;


        targetY =
            Math.max(
                0,
                Math.min(
                    maxY,
                    targetY
                )
            );

    }
);


/* =====================================
   POŁĄCZENIE
===================================== */

document
.getElementById("connect")
.addEventListener(
    "click",
    async () => {

        try {

            document
            .getElementById("status")
            .textContent =
                "Łączenie...";


            await triki.connect();


            trikiConnected =
                true;


            /*
                Start paletki
                na środku.
            */

            targetY =
                canvas.height / 2 -
                player.height / 2;


            smoothY =
                targetY;


            document
            .getElementById("menu")
            .style.display =
                "none";


            document
            .getElementById("game")
            .style.display =
                "block";


            resetBall();


            requestAnimationFrame(
                gameLoop
            );

        }

        catch (error) {

            console.error(error);

            document
            .getElementById("status")
            .textContent =
                "❌ " +
                error.message;

        }

    }
);


/* =====================================
   RESET PIŁKI
===================================== */

function resetBall() {

    ball.x =
        canvas.width / 2;


    ball.y =
        canvas.height / 2;


    /*
        Wolna piłka.
    */

    ball.speedX =
        Math.random() > 0.5
            ? 4
            : -4;


    ball.speedY =
        (Math.random() - 0.5) * 5;

}


/* =====================================
   KOLIZJA
===================================== */

function paddleCollision(
    paddle
) {

    return (

        ball.x -
        ball.radius <
        paddle.x +
        paddle.width

        &&

        ball.x +
        ball.radius >
        paddle.x

        &&

        ball.y +
        ball.radius >
        paddle.y

        &&

        ball.y -
        ball.radius <
        paddle.y +
        paddle.height

    );

}


/* =====================================
   AI
===================================== */

function updateEnemy() {

    const target =
        ball.y -
        enemy.height / 2;


    if (
        enemy.y < target
    ) {

        enemy.y +=
            enemy.speed;

    }


    if (
        enemy.y > target
    ) {

        enemy.y -=
            enemy.speed;

    }


    if (
        enemy.y < 0
    ) {

        enemy.y = 0;

    }


    if (
        enemy.y +
        enemy.height >
        canvas.height
    ) {

        enemy.y =
            canvas.height -
            enemy.height;

    }

}


/* =====================================
   UPDATE
===================================== */

function update() {


    /*
        Płynny ruch paletki.
    */

    smoothY +=
        (
            targetY -
            smoothY
        ) *
        SMOOTHING;


    player.y =
        smoothY;


    /*
        AI
    */

    updateEnemy();


    /*
        PIŁKA
    */

    ball.x +=
        ball.speedX;


    ball.y +=
        ball.speedY;


    /*
        GÓRA / DÓŁ
    */

    if (

        ball.y -
        ball.radius <= 0

        ||

        ball.y +
        ball.radius >=
        canvas.height

    ) {

        ball.speedY *=
            -1;

    }


    /*
        GRACZ
    */

    if (

        paddleCollision(
            player
        )

        &&

        ball.speedX < 0

    ) {

        ball.speedX *=
            -1;


        const hit =

            (
                ball.y -

                (
                    player.y +
                    player.height / 2
                )

            )

            /

            (
                player.height / 2
            );


        ball.speedY =
            hit * 5;

    }


    /*
        PRZECIWNIK
    */

    if (

        paddleCollision(
            enemy
        )

        &&

        ball.speedX > 0

    ) {

        ball.speedX *=
            -1;


        const hit =

            (
                ball.y -

                (
                    enemy.y +
                    enemy.height / 2
                )

            )

            /

            (
                enemy.height / 2
            );


        ball.speedY =
            hit * 5;

    }


    /*
        PUNKT PRZECIWNIKA
    */

    if (
        ball.x < 0
    ) {

        enemyScore++;

        resetBall();

    }


    /*
        PUNKT GRACZA
    */

    if (
        ball.x >
        canvas.width
    ) {

        playerScore++;

        resetBall();

    }

}


/* =====================================
   RYSOWANIE
===================================== */

function draw() {


    /*
        TŁO
    */

    ctx.fillStyle =
        "#080808";

    ctx.fillRect(

        0,
        0,

        canvas.width,
        canvas.height

    );


    /*
        ŚRODEK
    */

    ctx.strokeStyle =
        "#333";

    ctx.setLineDash([
        10,
        15
    ]);


    ctx.beginPath();


    ctx.moveTo(

        canvas.width / 2,
        0

    );


    ctx.lineTo(

        canvas.width / 2,
        canvas.height

    );


    ctx.stroke();


    ctx.setLineDash([]);


    /*
        PALETKA GRACZA
    */

    ctx.fillStyle =
        "#00e676";


    ctx.fillRect(

        player.x,
        player.y,

        player.width,
        player.height

    );


    /*
        PALETKA AI
    */

    ctx.fillStyle =
        "#ff5252";


    ctx.fillRect(

        enemy.x,
        enemy.y,

        enemy.width,
        enemy.height

    );


    /*
        PIŁKA
    */

    ctx.fillStyle =
        "white";


    ctx.beginPath();


    ctx.arc(

        ball.x,
        ball.y,

        ball.radius,

        0,
        Math.PI * 2

    );


    ctx.fill();


    /*
        WYNIK
    */

    ctx.font =
        "bold 70px Arial";


    ctx.textAlign =
        "center";


    ctx.fillText(

        playerScore,

        canvas.width / 2 - 100,

        90

    );


    ctx.fillText(

        enemyScore,

        canvas.width / 2 + 100,

        90

    );

}


/* =====================================
   GAME LOOP
===================================== */

function gameLoop() {

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


</script>

</body>
</html>
